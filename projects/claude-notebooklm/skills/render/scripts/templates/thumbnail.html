<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-color: $bg_color;
    color: $text_color;
    font-family: $font_body;
    position: relative;
  }
  /* Grain overlay */
  body::after {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 1000;
  }
  /* Large gradient blob */
  .blob-large {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, ${accent_color}20, ${accent_color}08, transparent 70%);
    top: -120px; right: -100px;
    filter: blur(60px);
  }
  .blob-small {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at 60% 60%, ${accent_color}15, transparent 70%);
    bottom: -60px; left: -40px;
    filter: blur(50px);
  }
  .container {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
  }
  .eyebrow {
    font-family: $font_body;
    font-weight: 500;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: $accent_color;
    margin-bottom: 20px;
  }
  .title {
    font-family: $font_headline;
    font-weight: 700;
    font-size: 56px;
    color: $text_color;
    letter-spacing: -0.02em;
    line-height: 1.1;
    max-width: 900px;
    margin-bottom: 0;
    /* Subtle text shadow for readability */
    text-shadow: 0 2px 8px ${bg_color}80;
  }
  .title-line-2 {
    color: $accent_color;
  }
  .footer {
    position: absolute;
    bottom: 40px; left: 80px; right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .badge {
    font-family: $font_body;
    font-weight: 500;
    font-size: 14px;
    color: $bg_color;
    background-color: $accent_color;
    padding: 8px 20px;
    border-radius: 20px;
  }
  .handle {
    font-family: $font_body;
    font-weight: 400;
    font-size: 16px;
    color: $text_muted;
  }
</style>
</head>
<body>
  <div class="blob-large"></div>
  <div class="blob-small"></div>
  <div class="container">
    <div class="eyebrow">$eyebrow</div>
    <h1 class="title">
      $title_line_1
      <br>
      <span class="title-line-2">$title_line_2</span>
    </h1>
  </div>
  <div class="footer">
    <span class="badge">$badge</span>
    <span class="handle">$brand_handle</span>
  </div>
</body>
</html>
